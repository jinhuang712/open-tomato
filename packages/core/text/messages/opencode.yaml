gate.message: "{{v0}} 是 OpenTomato 写作角色的工具，切到主编再用"
gate.message_2: "{{v0}} 是 OpenTomato 的写作角色，只有主编能派"
gate.message_3: 写作角色不能用 {{v0}}：写文档用 write，改文档用 edit
gate.message_4: "{{v0}} 的内容不归你写：要改就派{{v1}}。你自己对它只能改记账字段（status / open / keywords），比如把作废的标 status: retired。"
gate.message_5: 只改了 {{v0}} 的 frontmatter 字段 {{v1}}，正文没动，无需作者审批。
gate.message_6: |-
  机检对这篇有话说：
  {{v0}}
gate.message_7: 或
gate.message_8: "{{v0}} 不存在，新建用 write"
gate.message_9: oldString 不能为空：要追加就带上文末最后一段一起替换
gate.message_10: "{{v0}} 里找不到 oldString，要逐字照抄原文（含标点和换行）。先 read_doc 拿磁盘上的原文再改。"
gate.message_11: oldString 在 {{v0}} 里出现了 {{v1}} 次，多带一两行上下文，确保只能匹配到一处
