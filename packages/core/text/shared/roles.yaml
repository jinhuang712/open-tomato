roles.director.label: 主编
roles.director.description: 统筹全书：判断当前阶段、派任务，把候选方案交给作者拍板。
roles.designer.label: 策划
roles.designer.description: 设计世界设定、人物和线索，提出候选并写入卡片。
roles.plotter.label: 编剧
roles.plotter.description: 编排里程碑、卷纲、章纲三层结构。
roles.writer.label: 写手
roles.writer.description: 按章纲写正文。
roles.ops.label: 运营
roles.ops.description: 只读。看故事是否吸引人、爽点安排是否合适、读者是否想追下去。
roles.reader.label: 读者
roles.reader.description: 只读。以目标读者身份看阅读体验。
roles.copyeditor.label: 文编
roles.copyeditor.description: 只读。抓机器味和文风偏差。
roles.proofreader.label: 校对
roles.proofreader.description: 只读。核对正文与卡片、章纲、前文是否一致。
roles.arbiter.label: 裁决
roles.arbiter.description: 只读。评审意见冲突时给出取舍。
