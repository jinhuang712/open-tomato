archive_agent.label: 封存子 agent
archive_agent.description: 封存一个跑完的子 agent：它退出在场名单进历史，会话保留可回看，之后不能再 continue_agent。用于：作者已拍板、它已把结果落盘、这条线上不再需要它；或它的候选被作者整体否掉、要换人重来。候选还悬着等拍板的不要封。在跑的不能封。
archive_agent.parameters.agent.description: 子 agent 的名字，如 策划1
continue_agent.label: 续派子 agent
continue_agent.description: 让已经完成一轮任务的子 agent 继续工作。它保留了之前的讨论，可以接着已有结果修改。用于：它给了候选、作者拍板后让它完善选中的候选并写入文件；或让它按作者意见修改。派出后立刻返回，报告做完后作为新消息送到你这里。agent 填派单名册或报告标题里的名字。不要用它重派一个全新的任务。
continue_agent.parameters.agent.description: 子 agent 的名字，如 策划1：派单名册和它报告的标题里都是这个
continue_agent.parameters.message.description: 发给它的消息：作者拍板了什么、接下来做什么
continue_agent.parameters.mode.description: 要切换它的落盘权限时给：拍板后让它落盘就传 commit；不传保持原样
list_agents.label: 在场的人
list_agents.description: 你派出去的人现在各是什么状态：名字 | 角色 | 状态 | 这状态意味着什么 | 任务书。读取开销小。恢复会话后第一件事就查这个：作者按过停止、应用重开过，都会让报告永远送不到你手上，而你的上下文里只留着「已派出」。要停下来等某位交回之前，先用它确认那位真的还在跑。
spawn_agents.label: 派子 agent
spawn_agents.description: 并行派一个或多个子 agent 干活。派出后立刻返回名册（每人一个名字，如 策划1），完成后报告作为新消息交回。可用角色：{{v0}}。任务书三行：干什么（kind/id）、按哪个决定、允许写入哪些内容；背景已在文档里就不重讲，要落实刚讨论好的内容，就附上几行作者已定的结论。mode=propose 禁止落盘；mode=commit 允许经审批写入，仅用于具体内容与写入范围已获授权的任务。ephemeral=true 是一次性任务（不需要保留上下文的简短评审等任务）：会话只在内存、不落盘，报告交回后不保留会话，不能 continue_agent；同一项任务还需要继续修改或续派的别用。fork=true 会把主编与作者的讨论全文转交过去（落实刚讨论好的内容时用），任务书只写这次新增的要求，与讨论记录冲突时，以任务书为准；问策、评审通常不用。同一项任务需要继续修改时，用 continue_agent 续派原 agent，不另开同样的任务。派 plotter / writer 要求 简介 的「一句话故事」已填，否则会被拒。
spawn_agents.parameters.tasks.task.description: 任务书
spawn_agents.parameters.tasks.mode.description: propose=只出候选不落盘；commit=可以落盘。默认 commit
spawn_agents.parameters.tasks.ephemeral.description: 一次性任务：会话只在内存、不落盘，报告交回后不保留会话，不能续派。适合不需要保留上下文的简短评审；还需要继续修改的别用。默认 false
spawn_agents.parameters.tasks.fork.description: 带上主编与作者的讨论全文转交，任务书只写这次新增的要求。落实刚讨论好的内容时用；问策、评审通常不用。默认 false
